<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/ifai.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#17191c" />
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('settings-storage');
          var theme = 'vs-dark';
          if (raw) {
            var parsed = JSON.parse(raw);
            theme = (parsed && parsed.state && parsed.state.theme) || theme;
          }
          var resolvedTheme = theme === 'light' ? 'light' : 'vs-dark';
          document.documentElement.setAttribute('data-theme', resolvedTheme);
          document.documentElement.style.backgroundColor = resolvedTheme === 'light' ? '#f5f7fa' : '#17191c';
        } catch (error) {
          document.documentElement.setAttribute('data-theme', 'vs-dark');
          document.documentElement.style.backgroundColor = '#17191c';
        }
      })();
    </script>
    <title>IfAI</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
