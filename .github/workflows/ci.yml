name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  check:
    name: Lint & Type Check & i18n
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci --legacy-peer-deps

      - name: Generate Tauri bindings
        run: npm run codegen

      - name: TypeScript type check
        run: node scripts/check-ci.mjs

      - name: i18n parity check
        run: npm run i18n:check -- --quiet

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: check

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci --legacy-peer-deps

      - name: Run tests
        run: npm run test:run
