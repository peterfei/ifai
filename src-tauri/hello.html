<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 40px 60px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
      text-align: center;
    }
    h1 {
      font-size: 48px;
      color: #333;
      margin: 0 0 10px;
    }
    p {
      color: #666;
      font-size: 18px;
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>👋 Hello!</h1>
    <p>欢迎来到 2048 项目</p>
  </div>
</body>
</html>
