# Google Gemini Provider Specification (Third-party API)
metadata:
  id: gemini-official
  name: Google Gemini
  protocol: gemini

api_spec:
  base_url: https://generativelanguage.googleapis.com/v1beta
  endpoint: /models/{model}:streamGenerateContent
  auth:
    type: bearer_header
    header_name: x-goog-api-key
    format: "{key}"

request_format:
  type: gemini_custom
  messages_wrapper: contents
  system_prompt_handling: separate_message
  tools_field: tools

response_format:
  type: sse
  stream_parser: gemini_sse
  content_extraction: candidates.0.content.parts.0.text

models:
  # Gemini 3.1 系列（第三方 API）
  - id: gemini-3.1-flash-image-preview
    name: Gemini 3.1 Flash Image Preview
    context_tokens: 1000000
    capabilities: [streaming, tools, vision]
    cost_per_1k_tokens: 0
    tags: [third-party, experimental]
  - id: gemini-3.1-pro-preview
    name: Gemini 3.1 Pro Preview
    context_tokens: 1000000
    capabilities: [streaming, tools, vision]
    cost_per_1k_tokens: 0
    tags: [third-party, experimental]
