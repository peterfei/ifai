# OpenAI Provider Specification
metadata:
  id: openai-official
  name: OpenAI
  protocol: openai

api_spec:
  base_url: https://api.openai.com/v1
  endpoint: /chat/completions
  auth:
    type: bearer_header
    header_name: Authorization
    format: "Bearer {key}"

request_format:
  type: openai_standard
  messages_wrapper: messages
  system_prompt_handling: separate_message
  tools_field: tools

response_format:
  type: sse
  stream_parser: openai_sse
  content_extraction: choices.0.delta.content

models:
  # GPT-5 系列（第三方 API）
  - id: gpt-5.4
    name: GPT-5.4
    context_tokens: 200000
    capabilities: [vision, tools, streaming]
    cost_per_1k_tokens: 0.008
  - id: gpt-5.2
    name: GPT-5.2
    context_tokens: 200000
    capabilities: [vision, tools, streaming]
    cost_per_1k_tokens: 0.006
  - id: gpt-5.1
    name: GPT-5.1
    context_tokens: 200000
    capabilities: [vision, tools, streaming]
    cost_per_1k_tokens: 0.005
  - id: gpt-5
    name: GPT-5
    context_tokens: 200000
    capabilities: [vision, tools, streaming]
    cost_per_1k_tokens: 0.005
  # GPT-4o 系列
  - id: gpt-4o
    name: GPT-4o
    context_tokens: 128000
    capabilities: [vision, tools, streaming]
    cost_per_1k_tokens: 0.005
  - id: gpt-4o-2024-11-20
    name: GPT-4o (2024-11-20)
    context_tokens: 128000
    capabilities: [vision, tools, streaming]
    cost_per_1k_tokens: 0.0025
  - id: gpt-4o-2024-08-06
    name: GPT-4o (2024-08-06)
    context_tokens: 128000
    capabilities: [vision, tools, streaming]
    cost_per_1k_tokens: 0.0025
  - id: gpt-4o-mini
    name: GPT-4o Mini
    context_tokens: 128000
    capabilities: [tools, streaming, vision]
    cost_per_1k_tokens: 0.00015
  # GPT-4 系列
  - id: gpt-4-turbo
    name: GPT-4 Turbo
    context_tokens: 128000
    capabilities: [tools, streaming, vision]
    cost_per_1k_tokens: 0.01
  - id: gpt-4
    name: GPT-4
    context_tokens: 8192
    capabilities: [tools, streaming]
    cost_per_1k_tokens: 0.03
  # GPT-3.5 系列
  - id: gpt-3.5-turbo
    name: GPT-3.5 Turbo
    context_tokens: 16385
    capabilities: [tools, streaming]
    cost_per_1k_tokens: 0.0005
  # O1 推理系列
  - id: o1
    name: O1
    context_tokens: 200000
    capabilities: [streaming]
    cost_per_1k_tokens: 0.015
  - id: o1-mini
    name: O1 Mini
    context_tokens: 128000
    capabilities: [streaming]
    cost_per_1k_tokens: 0.003
  - id: o1-preview
    name: O1 Preview
    context_tokens: 128000
    capabilities: [streaming]
    cost_per_1k_tokens: 0.015
  # O3 系列
  - id: o3-mini
    name: O3 Mini
    context_tokens: 200000
    capabilities: [streaming]
    cost_per_1k_tokens: 0.001

error_mapping:
  401: authentication_error
  429: rate_limit_error
  500: server_error
