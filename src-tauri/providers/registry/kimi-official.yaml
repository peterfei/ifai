# Kimi (Moonshot AI) Provider Specification
metadata:
  id: kimi-official
  name: Kimi (Moonshot AI)
  protocol: openai

api_spec:
  base_url: https://api.moonshot.cn/v1
  endpoint: /chat/completions
  auth:
    type: bearer_header
    header_name: Authorization
    format: "Bearer {key}"

request_format:
  type: openai_standard
  messages_wrapper: messages
  system_prompt_handling: separate_message
  tools_field: tools

response_format:
  type: sse
  stream_parser: openai_sse
  content_extraction: choices.0.delta.content

models:
  - id: moonshot-v1-k2.6
    name: Moonshot V1 K2.6
    context_tokens: 128000
    capabilities: [tools, streaming, vision]
    cost_per_1k_tokens: 0.012
    tags: [latest, premium]
  - id: moonshot-v1-128k
    name: Moonshot V1 128K
    context_tokens: 128000
    capabilities: [tools, streaming]
    cost_per_1k_tokens: 0.012
  - id: moonshot-v1-32k
    name: Moonshot V1 32K
    context_tokens: 32000
    capabilities: [tools, streaming]
    cost_per_1k_tokens: 0.008
  - id: moonshot-v1-8k
    name: Moonshot V1 8K
    context_tokens: 8000
    capabilities: [tools, streaming]
    cost_per_1k_tokens: 0.003

error_mapping:
  401: authentication_error
  429: rate_limit_error
  500: server_error
