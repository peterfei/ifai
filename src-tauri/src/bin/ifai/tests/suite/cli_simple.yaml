# tests/suite/cli_simple.yaml
#
# CLI 单次执行模式测试（简化版）
# 用于验证元编程测试框架

test_suite:
  name: "CLI 单次执行模式测试"
  description: "验证 CLI 基础功能"

  setup:
    env:
      IFAI_PROVIDER: "openai"
      OPENAI_API_KEY: "test-key"

  tests:
    - name: "简单提示词响应"
      description: "测试简单的提示词能够正常响应"
      given:
        args:
          - "hello"
      when:
        mock_response: "simple_response.json"
      then:
        assert_success: true
        assert_contains: "Hello"

    - name: "系统提示词生效"
      description: "测试系统提示词参数生效"
      given:
        args:
          - "--system"
          - "You are a helpful assistant"
          - "hello"
      when:
        mock_response: "simple_response.json"
      then:
        assert_success: true
        assert_contains: "Hello"

    - name: "帮助信息显示"
      description: "测试 --help 参数"
      given:
        args:
          - "--help"
      when: {}
      then:
        assert_success: true
        assert_contains: "Usage"

    - name: "版本信息显示"
      description: "测试 --version 参数"
      given:
        args:
          - "--version"
      when: {}
      then:
        assert_success: true
        assert_contains: "ifai"
