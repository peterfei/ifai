# tests/suite/parametrized_example.yaml
#
# 参数化测试示例
#
# 展示如何使用 parameters 字段生成多个测试用例

test_suite:
  name: "参数化测试示例"
  description: "演示参数化测试功能"

  tests:
    # 示例 1: 测试多个提供商
    - name: "测试提供商连接"
      description: "验证不同 AI 提供商的连接"
      parameters:
        provider:
          - openai
          - deepseek
          - anthropic
      given:
        env:
          IFAI_PROVIDER: "${{provider}}"
          IFAI_MODEL: "${{provider}}-model"
      when:
        mock_response: "simple_response.json"
      then:
        assert_success: true
        assert_contains: "${{provider}}"

    # 示例 2: 测试多个模型
    - name: "测试模型兼容性"
      description: "验证不同模型的兼容性"
      parameters:
        model:
          - gpt-4o-mini
          - gpt-4-turbo
          - claude-3-haiku
          - deepseek-chat
      given:
        args: ["--model", "${{model}}", "hello"]
      when:
        mock_response: "simple_response.json"
      then:
        assert_success: true

    # 示例 3: 多参数组合
    - name: "测试提供商和模型组合"
      description: "验证提供商和模型的组合"
      parameters:
        provider:
          - openai
          - deepseek
        model:
          - small
          - large
      given:
        env:
          IFAI_PROVIDER: "${{provider}}"
          IFAI_MODEL: "${{model}}"
      when:
        mock_response: "simple_response.json"
      then:
        assert_success: true

    # 示例 4: 参数化配置优先级
    - name: "配置源优先级"
      description: "验证不同配置源的优先级"
      parameters:
        config_source:
          - "CLI 参数"
          - "环境变量"
          - "配置文件"
      given:
        args: ["hello"]
        notes: "使用 ${{config_source }}"
      when:
        mock_response: "simple_response.json"
      then:
        assert_success: true
